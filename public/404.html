<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Rentivo</title>
    <script>
      // SPA redirect for GitHub Pages.
      // Encodes the full path into ?/ so the server always serves index.html,
      // then the script in index.html decodes it back and pushes to history.
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.host +
        l.pathname.split('/').slice(0, 2).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(1).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
</html>
